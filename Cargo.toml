[package]
name = "filthy-rich"
description = "Tiny, ergonomic Discord Rich Presence library for your Rust apps."
authors = ["Anindya Shiddhartha <shiddhartha@tuta.io>"]
repository = "https://github.com/hitblast/filthy-rich"
version = "1.0.8"
edition = "2024"
license = "MIT"
keywords = ["discord", "discord", "rich-presence", "ipc", "rpc"]
categories = ["development-tools"]
rust-version = "1.85.0"

[lib]
name = "filthy_rich"
path = "src/lib.rs"

[dependencies]
bytes = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "sync",
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "macros",
] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
must_use_candidate = "warn"

[lints.rust]
unused_must_use = "deny"

[profile.release]
lto = "thin"
